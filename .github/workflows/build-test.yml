name: build-test

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Verify locked restore, NuGet audit, formatting, build and tests
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Smoke test HTTP foundation
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: false
      - name: Build runtime image
        run: docker build -t backend-api:ci .
      - name: Smoke test runtime image
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Image backend-api:ci
      - name: Scan repository, secrets and runtime image
        shell: pwsh
        run: ./scripts/security-check.ps1 -Image backend-api:ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-results
          path: artifacts/
          if-no-files-found: warn

  publish-image:
    name: Publish image to GHCR
    needs: build-test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable and branch tags
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_SHA}"
          branch_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "$image_ref" \
            --tag "$branch_ref" \
            .
          docker push "$image_ref"
          docker push "$branch_ref"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy staging
    needs: publish-image
    if: >-
      needs.publish-image.result == 'success' &&
      github.ref == 'refs/heads/develop' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-linux.yml
    with:
      environment_name: staging
      image_ref: ${{ needs.publish-image.outputs.image_ref }}
    secrets: inherit

  deploy-production:
    name: Deploy production
    needs: publish-image
    if: >-
      needs.publish-image.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy-linux.yml
    with:
      environment_name: production
      image_ref: ${{ needs.publish-image.outputs.image_ref }}
    secrets: inherit
